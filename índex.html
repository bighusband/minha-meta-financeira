<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Meta Financeira</title>
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="Calculadora de metas financeiras offline.">
    
    <!-- Manifesto embutido via Data URI -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Minha Meta Financeira","short_name":"Meta Fin","start_url":"./index.html","display":"standalone","background_color":"%23f3f4f6","theme_color":"%234f46e5","icons":[{"src":"https://via.placeholder.com/192x192.png?text=Meta","sizes":"192x192","type":"image/png"},{"src":"https://via.placeholder.com/512x512.png?text=Meta","sizes":"512x512","type":"image/png"}]}'>

    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --card: #1f2937;
                --text: #f9fafb;
                --text-light: #9ca3af;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid transparent;
            border-radius: 8px;
            background-color: var(--bg);
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: var(--bg);
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0.5rem 0;
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .reset-btn {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid var(--text-light);
        }

        .status {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>💰 Minha Meta Financeira</h1>
        
        <div class="form-group">
            <label for="goal">Qual é o valor da sua meta? (R$)</label>
            <input type="number" id="goal" placeholder="Ex: 5000" step="0.01">
        </div>

        <div class="form-group">
            <label for="months">Em quantos meses? (Meses)</label>
            <input type="number" id="months" placeholder="Ex: 12" min="1">
        </div>

        <button onclick="calculate()">Calcular</button>

        <div id="result" class="result-box">
            <div class="result-label">Você precisa guardar por mês:</div>
            <div class="result-value" id="monthlyAmount">R$ 0,00</div>
            <div class="result-label" id="totalInfo">Total: R$ 0,00</div>
        </div>

        <button class="reset-btn" onclick="reset()">Limpar Tudo</button>
        
        <div class="status" id="statusMsg">Salvo localmente (Offline)</div>
    </div>

    <script>
        const goalInput = document.getElementById('goal');
        const monthsInput = document.getElementById('months');
        const resultBox = document.getElementById('result');
        const monthlyDisplay = document.getElementById('monthlyAmount');
        const totalDisplay = document.getElementById('totalInfo');

        window.onload = function() {
            const savedGoal = localStorage.getItem('pwa_goal');
            const savedMonths = localStorage.getItem('pwa_months');
            
            if (savedGoal) goalInput.value = savedGoal;
            if (savedMonths) monthsInput.value = savedMonths;

            if (savedGoal && savedMonths) calculate();
        };

        function calculate() {
            const goal = parseFloat(goalInput.value);
            const months = parseInt(monthsInput.value);

            if (isNaN(goal) || isNaN(months) || months <= 0 || goal <= 0) {
                alert("Por favor, preencha os valores corretamente.");
                return;
            }

            const monthly = goal / months;
            const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

            monthlyDisplay.textContent = formatter.format(monthly);
            totalDisplay.textContent = `Total: ${formatter.format(goal)}`;
            
            resultBox.classList.add('active');
            localStorage.setItem('pwa_goal', goal);
            localStorage.setItem('pwa_months', months);
        }

        function reset() {
            localStorage.removeItem('pwa_goal');
            localStorage.removeItem('pwa_months');
            goalInput.value = '';
            monthsInput.value = '';
            resultBox.classList.remove('active');
        }

        // Service Worker embutido via Blob (para funcionar sem arquivo externo sw.js)
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(r => r || fetch(e.request))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            navigator.serviceWorker.register(url).catch(err => console.log('SW erro:', err));
        }
    </script>
</body>
</html>
